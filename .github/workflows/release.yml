name: Release

on:
  push:
    tags:
      - "v*"
  # Build-only dry run when the release pipeline itself changes.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name=prog-${{ matrix.target }}
          mkdir -p dist "$name"
          cp README.md "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/prog.exe "$name/"
            7z a "dist/$name.zip" "$name" >/dev/null
            asset="dist/$name.zip"
          else
            cp target/${{ matrix.target }}/release/prog "$name/"
            tar -czf "dist/$name.tar.gz" "$name"
            asset="dist/$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" | awk '{print $1}' > "$asset.sha256"
          else
            shasum -a 256 "$asset" | awk '{print $1}' > "$asset.sha256"
          fi

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: ./prog-${{ matrix.target }}/prog --version

      - uses: actions/upload-artifact@v4
        with:
          name: prog-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          repository: bytemain/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap
      - name: Commit formula
        run: |
          mkdir -p homebrew-tap/Formula
          scripts/homebrew-formula.sh "${GITHUB_REF_NAME#v}" dist > homebrew-tap/Formula/prog.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/prog.rb
          git commit -m "prog ${GITHUB_REF_NAME}"
          git push

  verify-homebrew:
    name: Verify brew install (${{ matrix.os }})
    needs: homebrew
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Set up Homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@main
      - run: |
          brew install bytemain/tap/prog
          prog --version | grep -F "${GITHUB_REF_NAME#v}"
