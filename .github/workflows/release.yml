name: Release

# Build prebuilt binaries in CI and publish them to a GitHub Release.
# Push a tag like `v0.1.0` to cut a release; PRs touching this file only run
# the build matrix (no release) so the pipeline can be checked before tagging.
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="prog-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md "dist/$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/prog.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/prog" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/prog"
          [[ "${{ matrix.target }}" == *windows* ]] && bin="$bin.exe"
          "$bin" --version

      - uses: actions/upload-artifact@v4
        with:
          name: prog-${{ matrix.target }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  homebrew:
    name: Update Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render formula
        run: |
          set -euo pipefail
          sha() { cut -d' ' -f1 "dist/prog-$1.tar.gz.sha256"; }
          version="${GITHUB_REF_NAME#v}"
          mkdir -p Formula
          sed \
            -e "s/@VERSION@/$version/g" \
            -e "s/@SHA_MAC_ARM@/$(sha aarch64-apple-darwin)/" \
            -e "s/@SHA_MAC_X64@/$(sha x86_64-apple-darwin)/" \
            -e "s/@SHA_LINUX_ARM@/$(sha aarch64-unknown-linux-musl)/" \
            -e "s/@SHA_LINUX_X64@/$(sha x86_64-unknown-linux-musl)/" \
            scripts/prog.rb.in > Formula/prog.rb
          cat Formula/prog.rb

      - name: Commit formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/prog.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore: update Homebrew formula to ${GITHUB_REF_NAME}"
          git push origin HEAD:main
